baseURL: https://guillaumedelre.github.io/
title: Guillaume Delré
theme: risotto

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: English
    languageCode: en
    weight: 1
    contentDir: content/en
    params:
      about:
        title: Guillaume Delré
        description: "I write about tech experiments, dev and whatever I find interesting."
        logo_image: /assets/images/og-default.jpg
    menu:
      main:
        - name: Blog
          url: /posts/
          weight: 5
        - name: Categories
          url: /categories/
          weight: 20
        - name: Tags
          url: /tags/
          weight: 25
        - name: Archives
          url: /archives/
          weight: 30
  fr:
    languageName: Français
    languageCode: fr-FR
    weight: 2
    contentDir: content/fr
    params:
      about:
        title: Guillaume Delré
        description: "J'écris sur mes expérimentations tech, le dev et tout ce que je trouve intéressant."
        logo_image: /assets/images/og-default.jpg
    menu:
      main:
        - name: Blog
          url: /fr/posts/
          weight: 5
        - name: Catégories
          url: /fr/categories/
          weight: 20
        - name: Tags
          url: /fr/tags/
          weight: 25
        - name: Archives
          url: /fr/archives/
          weight: 30

description: Homelab, Docker and IoT experiments.

services:
  googleAnalytics:
    id: G-KJ5HF5SY3R

taxonomies:
  category: categories
  tag: tags
  series: series

pagination:
  pagerSize: 10

params:
  author: Guillaume Delré
  images:
    - /assets/images/og-default.jpg

  theme:
    palette: tokyo-night-dark

  socialLinks:
    - icon: fa-brands fa-github
      title: GitHub
      url: https://github.com/guillaumedelre
    - icon: fa-brands fa-linkedin
      title: LinkedIn
      url: https://www.linkedin.com/in/guillaumedelre/
    - icon: fa-solid fa-envelope
      title: Email
      url: mailto:delre.guillaume@gmail.com
    - icon: fa-solid fa-rss
      title: RSS
      url: /index.xml

  schema:
    publisherType: Person
    sameAs:
      - "https://github.com/guillaumedelre"
      - "https://www.linkedin.com/in/guillaumedelre/"

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 3
  goldmark:
    renderer:
      unsafe: true

permalinks:
  posts: /:year/:month/:day/:slug/

outputs:
  home:
    - HTML
    - RSS
