{{ define "main" }}
  <header class="content__header">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </header>
  {{ $pages := .Pages }}
  {{ if eq .Data.Plural "series" }}{{ $pages = sort .Pages "Params.part" }}{{ end }}
  {{ partial "post_list.html" $pages }}
{{ end }}

{{ define "aside" }}
  {{ with .Description }}<p>{{ . }}</p>{{ end }}
{{ end }}
